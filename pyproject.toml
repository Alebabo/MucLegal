[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muclegal"
version = "0.1.0"
description = "Deterministischer Unterlassungs- und Umsetzungsmonitor"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "jinja2==3.1.5",
  "lxml==6.1.1",
  "Pillow==11.3.0",
  "playwright==1.59.0",
  "psutil==7.2.2",
  "pypdf==6.16.1",
  "reportlab==4.5.1",
  "trafilatura==2.2.0",
  "uvicorn==0.34.0",
  "warcio==1.8.1",
]

[project.optional-dependencies]
demo = [
  "anthropic==0.122.0",
]

[project.scripts]
muclegal = "muclegal.cli:main"

[tool.setuptools.packages.find]
include = ["muclegal*"]

