    begruendung: >
      Zweifelhaft. Der Tenor knüpft an „erst nach Klick ... sichtbar wird“ an. Fehlt
      der Klick, greift der konkretisierende Teil nicht mehr. Ordnungsmittelverfahren
      mit offenem Ausgang.
    sicherheit: niedrig

